name: Build TWRP for TECNO-BF7

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout device tree
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y git-core gnupg flex bison build-essential \
        zip curl zlib1g-dev gcc-multilib g++-multilib \
        libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev \
        libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip

    - name: Install repo tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Init TWRP source
      run: |
        mkdir twrp
        cd twrp
        repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1
        repo sync -j2

    - name: Copy device tree
      run: |
        cd twrp
        mkdir -p device/tecno/TECNO-BF7
        cp -r $GITHUB_WORKSPACE/* device/tecno/TECNO-BF7/

    - name: Build recovery
      run: |
        cd twrp
        source build/envsetup.sh
        lunch omni_TECNO-BF7-eng
        mka -j2 recoveryimage

    - name: Upload recovery.img
      uses: actions/upload-artifact@v4
      with:
        name: recovery-TECNO-BF7
        path: twrp/out/target/product/TECNO-BF7/recovery.img
